name: Validate detection content

# The point of this workflow is the tested-status check. Everything else is
# ordinary linting; that one enforces the promise the README makes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Rule metadata and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Every rule must declare a tested status
        run: |
          python - <<'PY'
          import pathlib, re, sys
          pat = re.compile(r"tested[ _]status|has not tested|not tested|tested:\s*(yes|no)", re.I)
          bad = []
          for ext in ("*.yml", "*.yaml", "*.rules", "*.xml", "*.yar", "*.yara"):
              for p in pathlib.Path(".").rglob(ext):
                  if ".github" in p.parts:
                      continue
                  if not pat.search(p.read_text(encoding="utf-8", errors="replace")):
                      bad.append(str(p))
          for p in bad:
              print(f"::error file={p}::declares no tested status. An untested rule is fine; "
                    f"an undeclared one is not - see README.")
          sys.exit(1 if bad else 0)
          PY

      - name: Every rule must document false positives
        run: |
          python - <<'PY'
          import pathlib, re, sys
          pat = re.compile(r"falsepositives|false positives", re.I)
          bad = []
          for ext in ("*.yml", "*.yaml", "*.rules", "*.xml", "*.yar", "*.yara"):
              for p in pathlib.Path(".").rglob(ext):
                  if ".github" in p.parts:
                      continue
                  if not pat.search(p.read_text(encoding="utf-8", errors="replace")):
                      bad.append(str(p))
          for p in bad:
              print(f"::error file={p}::documents no false positives. Every rule has some.")
          sys.exit(1 if bad else 0)
          PY

      - name: Sigma rules parse as YAML
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in pathlib.Path("sigma").rglob("*.yml"):
              try:
                  list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
              except Exception as exc:
                  bad.append((str(p), str(exc).splitlines()[0]))
          for p, e in bad:
              print(f"::error file={p}::{e}")
          print(f"{len(list(pathlib.Path('sigma').rglob('*.yml')))} sigma file(s) checked")
          sys.exit(1 if bad else 0)
          PY

      - name: Wazuh rulesets parse as XML
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          bad = []
          for p in pathlib.Path("wazuh").rglob("*.xml"):
              try:
                  ET.parse(p)
              except ET.ParseError as exc:
                  bad.append((str(p), str(exc)))
          for p, e in bad:
              print(f"::error file={p}::{e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Suricata rules are terminated and carry a sid
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path("suricata").rglob("*.rules"):
              text = re.sub(r"\\s*\n\s*", " ", p.read_text(encoding="utf-8"))
              for line in text.splitlines():
                  line = line.strip()
                  if not line.startswith("alert"):
                      continue
                  if not line.endswith(")") or not re.search(r"sid:\d+", line):
                      bad.append((str(p), line[:70]))
          for p, l in bad:
              print(f"::error file={p}::malformed or missing sid: {l}")
          sys.exit(1 if bad else 0)
          PY

      - name: No Nulvex infrastructure detail in public rules
        run: |
          python - <<'PY'
          import pathlib, re, sys
          pats = [
              (r"\b10\.10\.(?:10|20|30|40)\.\d{1,3}\b", "internal address range"),
              (r"\b100\.64\.200\.\d{1,3}\b", "overlay address range"),
              (r"\b(?:drive|vault|soc|pve|fw|hub|command|ntfy|id)\.nulvex\.com\b", "internal hostname"),
          ]
          bad = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              try:
                  t = p.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  continue
              for pat, label in pats:
                  if re.search(pat, t):
                      bad.append((str(p), label))
          for p, l in bad:
              print(f"::error file={p}::{l} present in a public rule file")
          sys.exit(1 if bad else 0)
          PY
