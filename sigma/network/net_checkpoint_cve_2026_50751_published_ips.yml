title: Check Point CVE-2026-50751 Published Infrastructure IP Match
id: 50b68e9d-0d36-4dd3-a9cd-43816fd9fe46
status: experimental
description: |
  Matches the 16 IPv4 indicators published by Check Point in its June 8, 2026
  IKEv1 advisory and June 9 to June 11 additions. Indicators are credited to
  Check Point Research, Lotem Finkelstein. SourceIp and DestinationIp are proposed
  normalized collector mappings, not a verified Check Point native log schema.
  This is an infrastructure match, not a detection of the authentication bypass
  or proof of compromise. The two vendor MD5 indicators are not covered.
  Nulvex has not tested this rule against real telemetry. Validate mapping,
  event selection and backend compilation before use. Tested status: NOT TESTED.
references:
  - https://blog.checkpoint.com/security/check-point-releases-important-hotfix-for-vulnerabilities-in-deprecated-ikev1-vpn-protocol/
