title: AF_ALG Kernel Crypto Socket Created by Non-Root User
id: 8f2b1c4e-3a6d-4e91-9c07-5d8a2f4b7e13
status: experimental
description: |
  Detects creation of an AF_ALG socket (address family 38), the Linux kernel's
  userspace crypto interface.

  AF_ALG exists so that userspace can drive kernel crypto drivers, typically for
  hardware offload. Most applications never touch it: they use OpenSSL, libgcrypt,
  NSS or a language runtime's own crypto, all of which work in userspace.

  CORRECTED 2026-09-24. An earlier version said "on ordinary server workloads
  almost nothing uses it". That was overstated. Real consumers include cryptsetup,
  iwd, libkcapi (used by dracut), bluez and iproute2, and the kernel's own AF_ALG
  restriction work maintains an algorithm ALLOWLIST for unprivileged iwd, bluez
  and iproute2 -- direct evidence that those programs open AF_ALG sockets in
  normal operation. See falsepositives below, which was always the honest part of
  this rule; the description was not.

  The defensible claim is narrower: the base rate is low on SERVER workloads that
  do not run iwd or bluez. On a laptop or desktop it may not be low at all. Nulvex
  has NOT measured the per-host event rate, and consumer count is not event rate --
  cryptsetup runs at unlock and dracut at initramfs build, while iwd and bluez are
  the consumers likely to produce recurring events.

  Where the base rate genuinely is low, this rule is worth running: AF_ALG socket
  creation is the required first step of the public CVE-2026-31431 exploit, which
  cannot avoid it and still use the bug.

  Prefer mitigation over detection where the kernel supports it. AF_ALG was
  deprecated in 2026 with parts removed in the 7.2 cycle, and the af_alg_restrict
  sysctl (0 unrestricted, 1 limited allowlist, 2 disabled) defaults to 1 from
  Linux 7.3. Setting it to 2 where no AF_ALG consumer is needed closes the
  exposure outright, which is stronger than alerting on it. This rule's long-term
  value declines as those kernels land.

  NULVEX HAS NOT TESTED THIS RULE AGAINST TELEMETRY FROM A REAL EXPLOITATION
  ATTEMPT. It is written from the documented syscall behaviour and the published
  exploit description. Validate it in your own environment before relying on it.
references:
  - https://nulvex.com/research/cve/cve-2026-31431-af-alg-page-cache-write/
  - https://nvd.nist.gov/vuln/detail/CVE-2026-31431
  - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  - https://xint.io/blog/copy-fail-linux-distributions
  # Evidence for the 2026-09-24 base-rate correction: names the real AF_ALG
  # consumers and the unprivileged allowlist, and documents af_alg_restrict.
  - https://lwn.net/Articles/1088489/
  - https://docs.kernel.org/crypto/userspace-if.html
author: Nulvex Security Research
date: 2026-09-09
modified: 2026-09-24
tags:
  - attack.privilege-escalation
  - attack.t1068
  - cve.2026-31431
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'SYSCALL'
    syscall: 41          # socket(2)
    a0: 38               # AF_ALG
    success: 'yes'
  filter_root:
    auid: 0
  condition: selection and not filter_root
fields:
  - auid
  - uid
  - pid
  - comm
  - exe
falsepositives:
  - Legitimate AF_ALG consumers. These exist and are the reason to measure before
    alerting. Known users include cryptsetup and dm-crypt tooling in some
    configurations, libkcapi and anything built on it, some strongSwan and IPsec
    deployments that offload to kernel crypto, and FIPS-oriented stacks that
    deliberately route through the kernel crypto module.
  - iwd, bluez and iproute2. Added 2026-09-24. The kernel's AF_ALG restriction
    work allowlists specific algorithms for these three as UNPRIVILEGED users of
    the interface, so they are expected consumers rather than edge cases. iwd in
    particular uses kernel crypto by design instead of bundling its own, so on a
    host running it this rule should be assumed noisy until measured.
  - dracut, via libkcapi, during initramfs builds.
  - Performance or crypto benchmarking tools.
  - On a host where any of the above run, this rule will be noisy and should be
    scoped to specific hosts or given an exclusion for the known executable path.
level: medium
---
# Deployment notes (not part of the Sigma rule)
#
# The auditd rule that produces the events this looks for:
#
#   -a always,exit -F arch=b64 -S socket -F a0=38 -k af_alg_socket
#
# Note that the rule above deliberately does NOT filter on auid, so that service
# accounts below UID 1000 are also captured; the Sigma filter above excludes only
# auid=0. Adjust to taste, but be aware that filtering on `auid>=1000` in the
# auditd rule itself is a common and silent way to miss a service account.
#
# Before enabling this as an alert, run it as a hunt for at least a week of
# representative load and confirm the base rate on your own hosts is what you
# expect. A rule that fires daily gets turned off, and the value of this one is
# entirely in its rarity.
#
# On hosts with eBPF-based tooling the same event is available more cheaply than
# through auditd syscall rules. The field names differ by product; the condition
# is the same, AF_ALG (38) as the family argument to socket().
